          # ── 6. Also fix root settings.gradle.kts if it's missing Flutter plugin ─
          SETTINGS_KTS="../settings.gradle.kts"
          if [ -f "$SETTINGS_KTS" ]; then
            if ! grep -q 'dev.flutter.flutter-gradle-plugin' "$SETTINGS_KTS" && \
               ! grep -q 'flutter.gradle' "$SETTINGS_KTS"; then
              echo "⚠️ settings.gradle.kts doesn't reference Flutter plugin — project may use flutter { source } block instead"
            fi
            # Ensure pluginManagement + dependencyResolutionManagement blocks exist
            if ! grep -q 'pluginManagement' "$SETTINGS_KTS"; then
              cat > "$SETTINGS_KTS" << SETTINGS_KTS_NEW
pluginManagement {
    val flutterSdkPath = run {
        val properties = java.util.Properties()
