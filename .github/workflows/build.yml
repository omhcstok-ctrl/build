    id("org.jetbrains.kotlin.android") version "2.1.0" apply false
}

include(":app")
SETTINGS_KTS_NEW
              echo "✅ Wrote fresh settings.gradle.kts"
            fi
          fi

          # ── 7. Also fix root build.gradle.kts ──────────────────────────────
          ROOT_GRADLE_KTS="../build.gradle.kts"
          if [ -f "$ROOT_GRADLE_KTS" ]; then
            # Only rewrite if it's essentially empty or broken
            LINES=$(wc -l < "$ROOT_GRADLE_KTS" 2>/dev/null || echo 0)
            if [ "$LINES" -lt 5 ]; then
              cat > "$ROOT_GRADLE_KTS" << ROOT_KTS
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    val newBuildDir: Directory = rootProject.layout.buildDirectory.dir(project.name).get()
    project.layout.buildDirectory.value(newBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}
ROOT_KTS
              echo "✅ Wrote fresh root build.gradle.kts"
            fi
          fi

          echo "=== Deep fix complete ==="

      # ============================================================
      #  FLUTTER - AUTO-DETECT FLUTTER VERSION FROM pubspec.yaml
      # ============================================================
      - name: Auto-detect Flutter version from pubspec.yaml
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"

          # ====================================================================
          # 1. PARSE DART SDK CONSTRAINT
          #    e.g. ">=3.1.0 <4.0.0"  →  DART_VERSION="3.1", UPPER_BOUND="<4.0.0"
          # ====================================================================
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'"'"']//g' || true)
          echo "Detected raw SDK constraint: $SDK_LINE"

          DART_VERSION=""
          if echo "$SDK_LINE" | grep -qE '>='; then
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '>=[[:space:]]*[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          elif echo "$SDK_LINE" | grep -qE '\^'; then
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '\^[[:space:]]*[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          else
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          fi
          echo "Extracted Dart version (min): $DART_VERSION"

          # Extract upper bound if present (e.g. "<4.0.0", "<3.5.0", "<3.4.0")
          UPPER_BOUND=$(echo "$SDK_LINE" | grep -oE '<[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "Extracted upper bound: ${UPPER_BOUND:-none}"

          # ====================================================================
          # 2. MAPPING DART SDK → FLUTTER VERSION
          #
          #    v3.2.1 FIX: Always default to LATEST STABLE Flutter (3.35.2 = Dart 3.5+).
          #    Older logic mapped Dart 3.1 → Flutter 3.13.0, but if user had
          #    flutter_lints >=5.0.0 (which requires Dart 3.5+) the build would
          #    fail with "version solving failed".
          #
          #    Only downgrade to older Flutter if pubspec.yaml has an EXPLICIT
          #    upper bound that excludes Dart 3.5 (e.g. "<3.5.0" or "<3.4.0").
          # ====================================================================
          FLUTTER_VERSION="3.35.2"  # default: latest stable (Dart 3.5+)

          # Check if upper bound excludes Dart 3.5+
          # i.e. upper bound is < 3.5.0 → must use older Flutter
          EXCLUDES_DART_35=false
          if [ -n "$UPPER_BOUND" ]; then
            UB_MAJOR=$(echo "$UPPER_BOUND" | cut -d. -f1)
            UB_MINOR=$(echo "$UPPER_BOUND" | cut -d. -f2)
            if [ "$UB_MAJOR" = "3" ] && [ "$UB_MINOR" -lt 5 ] 2>/dev/null; then
              EXCLUDES_DART_35=true
            fi
          fi

          if [ "$EXCLUDES_DART_35" = "true" ]; then
            echo "Upper bound <$UPPER_BOUND excludes Dart 3.5+ → using older Flutter"
            case "$DART_VERSION" in
              "3.4"*) FLUTTER_VERSION="3.22.0" ;;
              "3.3"*) FLUTTER_VERSION="3.19.0" ;;
              "3.2"*) FLUTTER_VERSION="3.16.0" ;;
              "3.1"*) FLUTTER_VERSION="3.13.0" ;;
              "3.0"*) FLUTTER_VERSION="3.10.0" ;;
              *)       FLUTTER_VERSION="3.22.0" ;;
            esac
          else
            echo "No upper-bound exclusion → using latest stable Flutter $FLUTTER_VERSION"
          fi

          # ====================================================================
          # 3. PLUGIN-BASED VERSION OVERRIDE (latest plugins need latest Flutter)
          #    v3.2.1: Added flutter_lints / lints / very_good_analysis
          #    (these are the #1 cause of "version solving failed" errors)
          # ====================================================================
          # flutter_lints >=5.0.0 requires Dart >=3.5.0 → Flutter 3.35.2
          if grep -Eq 'flutter_lints:[[:space:]]*(\^|>=)?[5-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: flutter_lints 5.0+ → Flutter $FLUTTER_VERSION"
          fi
          # lints >=5.0.0 requires Dart >=3.5.0
          if grep -Eq '^[[:space:]]*lints:[[:space:]]*(\^|>=)?[5-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: lints 5.0+ → Flutter $FLUTTER_VERSION"
          fi
          # very_good_analysis >=7.0.0 requires Dart >=3.5.0
          if grep -Eq 'very_good_analysis:[[:space:]]*(\^|>=)?[7-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: very_good_analysis 7.0+ → Flutter $FLUTTER_VERSION"
          fi
          # webview_flutter 4.15+/5.x → latest
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?4\.(1[5-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?5\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: webview_flutter 4.15+/5.x → Flutter $FLUTTER_VERSION"
          fi
          # geolocator 14+/15+ → latest
          if grep -Eq 'geolocator:[[:space:]]*(\^|>=)?(14|15)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: geolocator 14+/15+ → Flutter $FLUTTER_VERSION"
          fi
          # google_maps_flutter 2.10+/3.x → latest
          if grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?2\.(1[0-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: google_maps_flutter 2.10+/3.x → Flutter $FLUTTER_VERSION"
          fi
          # firebase_* 3.x → latest
          if grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'firebase_[a-z_]+:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: firebase_* 3.x → Flutter $FLUTTER_VERSION"
          fi
          # flutter_local_notifications 17+/18+ → latest
          if grep -Eq 'flutter_local_notifications:[[:space:]]*(\^|>=)?(17|18)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: flutter_local_notifications 17+/18+ → Flutter $FLUTTER_VERSION"
          fi
          # workmanager 0.6+ → latest
          if grep -Eq 'workmanager:[[:space:]]*(\^|>=)?0\.(6|[7-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: workmanager 0.6+ → Flutter $FLUTTER_VERSION"
          fi
          # image_picker 1.20+ → latest
          if grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: image_picker 1.20+ → Flutter $FLUTTER_VERSION"
          fi
          # file_picker 8+/9+ → latest
          if grep -Eq 'file_picker:[[:space:]]*(\^|>=)?(8|9)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: file_picker 8+/9+ → Flutter $FLUTTER_VERSION"
          fi
          # permission_handler 12+/13+ → latest
          if grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?(12|13)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
            echo "Override: permission_handler 12+/13+ → Flutter $FLUTTER_VERSION"
          fi
          # flutter_sound 9.10+ → at least 3.27.0
          if grep -Eq 'flutter_sound:[[:space:]]*(\^|>=)?9\.([1-9][0-9])' "$PUBSPEC"; then
            if [ "$FLUTTER_VERSION" \< "3.27.0" ] 2>/dev/null; then FLUTTER_VERSION="3.27.0"; fi
            echo "Override: flutter_sound 9.10+ → Flutter $FLUTTER_VERSION"
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "Final Flutter version: $FLUTTER_VERSION (Dart SDK constraint: $SDK_LINE)"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      #  FLUTTER - PRE-BUILD CODE FIXES (single pass, very accurate)
      # ============================================================
      - name: Pre-build code fixes (deprecated APIs, missing imports)
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          echo "Memulai build di Homeserver OmhcSilence — pre-build code analysis..."

          # ====================================================================
          # Patch deprecated Dart APIs (Flutter 3.27+ moved away from these)
          # ====================================================================
          find lib/ -name "*.dart" -type f 2>/dev/null | while IFS= read -r FILE; do
            if [ ! -f "$FILE" ]; then continue; fi
            CHANGED=0
            # .withValues(alpha: X) → .withOpacity(X)
            if grep -q '\.withValues(alpha:' "$FILE"; then
              sed -i -E 's/\.withValues\(alpha:\s*([^)]+)\)/.withOpacity(\1)/g' "$FILE"
              CHANGED=1
            fi
            # Color.value → Color.toARGB32()
            if grep -Eq '\bColor\b.*\.value\b' "$FILE"; then
              sed -i -E 's/(\w+Color)\.value\b/(\1.toARGB32())/g' "$FILE"
              CHANGED=1
            fi
            # Missing imports
            if grep -Eq '\b(StreamSubscription|StreamController|Completer|Timer)\b' "$FILE" && ! grep -q "import 'dart:async'" "$FILE"; then
              sed -i "1i import 'dart:async';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\bUint8List\b' "$FILE" && ! grep -q "import 'dart:typed_data'" "$FILE"; then
              sed -i "1i import 'dart:typed_data';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\b(jsonEncode|jsonDecode|utf8|base64)\b' "$FILE" && ! grep -q "import 'dart:convert'" "$FILE"; then
              sed -i "1i import 'dart:convert';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\bhttp\.(get|post|put|delete|patch|Response|Client)\b' "$FILE" && ! grep -q "import 'package:http" "$FILE"; then
              sed -i "1i import 'package:http/http.dart' as http;" "$FILE"
              CHANGED=1
            fi
            if [ "$CHANGED" = "1" ]; then
              echo "Patched: $FILE"
            fi
          done

          # Ensure INTERNET permission
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application\b|<uses-permission android:name="android.permission.INTERNET" />\n    <application|g' "$MANIFEST"
            echo "Added INTERNET permission"
          fi
          # usesCleartextTraffic for HTTP apps
          if [ -f "$MANIFEST" ] && ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application\b|<application android:usesCleartextTraffic="true"|g' "$MANIFEST"
          fi
          # android:exported (Android 12+ requirement)
          if [ -f "$MANIFEST" ] && ! grep -q 'android:exported' "$MANIFEST"; then
            sed -i 's|<activity\b|<activity android:exported="true"|g' "$MANIFEST"
          fi

          # Cleanup stale lock files (forces fresh resolution)
          rm -f pubspec.lock .flutter-plugins .flutter-plugins-dependencies

      # ============================================================
      #  FLUTTER - PUB GET (single attempt; bot's auto-fix handles rebuild if this fails)
      # ============================================================
      - name: Flutter pub get
        if: env.type == 'flutter'
        run: |
          cd flutter-project
          flutter pub get 2>&1 | tee pubget.log
          if [ ! -f pubspec.lock ]; then
            echo "pub get failed — bot's auto-fix will handle rebuild"
            exit 1
          fi
          echo "pub get sukses"

      # ============================================================
      #  FLUTTER - BUILD APK (single attempt — bot handles rebuild if this fails)
      # ============================================================
      - name: Build Flutter APK
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          echo "Memulai build di Homeserver OmhcSilence — kompilasi APK..."
          BUILD_MODE="${{ env.build_type }}"
          if [ "$BUILD_MODE" = "release" ]; then
            flutter build apk --release 2>&1 | tee build.log
          else
            flutter build apk --debug 2>&1 | tee build.log
          fi
          # Check if APK exists
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Build APK tidak ditemukan — bot's auto-fix akan menganalisis dan rebuild"
            exit 1
          fi
          echo "APK sukses di-build: $APK_PATH"

      - name: Verify Flutter APK signature
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH" || \
              $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
          fi

      # ============================================================ UPLOAD ==
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
