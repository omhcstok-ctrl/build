      - name: Fix Flutter Android config + signing
        if: env.type == 'flutter'
        run: |
          cd flutter-project/android/app
          cp ../../../release.keystore .

          # compileSdk → 35 (cap to avoid bleeding-edge issues)
          # minSdk → 21 (Flutter default)
          # targetSdk → 34
          # Java → 17
          if [ -f build.gradle ]; then
            sed -i 's/compileSdk [0-9]*/compileSdk 35/g' build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 34/g' build.gradle
            sed -i 's/minSdk [0-9]*/minSdk 21/g' build.gradle
            sed -i 's|sourceCompatibility JavaVersion\.VERSION_[0-9]*|sourceCompatibility JavaVersion.VERSION_17|g' build.gradle
            sed -i 's|targetCompatibility JavaVersion\.VERSION_[0-9]*|targetCompatibility JavaVersion.VERSION_17|g' build.gradle
            sed -i 's|storeFile file(".*")|storeFile file("release.keystore")|g' build.gradle
            sed -i 's|storePassword ".*"|storePassword "password"|g' build.gradle
            sed -i 's|keyAlias ".*"|keyAlias "release"|g' build.gradle
            sed -i 's|keyPassword ".*"|keyPassword "password"|g' build.gradle
          elif [ -f build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 21/g' build.gradle.kts
            sed -i 's|sourceCompatibility = JavaVersion\.VERSION_[0-9]*|sourceCompatibility = JavaVersion.VERSION_17|g' build.gradle.kts
            sed -i 's|targetCompatibility = JavaVersion\.VERSION_[0-9]*|targetCompatibility = JavaVersion.VERSION_17|g' build.gradle.kts
            sed -i 's|storeFile = file(".*")|storeFile = file("release.keystore")|g' build.gradle.kts
            sed -i 's|storeFile.set(file(".*"))|storeFile.set(file("release.keystore"))|g' build.gradle.kts
            sed -i 's|storePassword = ".*"|storePassword = "password"|g' build.gradle.kts
            sed -i 's|storePassword.set(".*")|storePassword.set("password")|g' build.gradle.kts
            sed -i 's|keyAlias = ".*"|keyAlias = "release"|g' build.gradle.kts
            sed -i 's|keyAlias.set(".*")|keyAlias.set("release")|g' build.gradle.kts
            sed -i 's|keyPassword = ".*"|keyPassword = "password"|g' build.gradle.kts
            sed -i 's|keyPassword.set(".*")|keyPassword.set("password")|g' build.gradle.kts
          else
            echo "build.gradle / build.gradle.kts tidak ditemukan"
            exit 1
          fi

          # gradle.properties — JVM heap + AndroidX
          PROPS="../gradle.properties"
          if [ -f "$PROPS" ]; then
            grep -q 'org.gradle.jvmargs' "$PROPS" || echo 'org.gradle.jvmargs=-Xmx2g' >> "$PROPS"
            grep -q 'android.useAndroidX' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
            grep -q 'android.enableJetifier' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"
          fi

      # ============================================================
      #  FLUTTER - DEEP FIX: Rewrite build.gradle(.kts) from scratch
      #  v3.2.3: If the existing build.gradle.kts has syntax errors (e.g.
      #  "Build file '...' line: 18"), the sed-based fix above won't help
      #  because it only replaces existing patterns — it can't ADD missing
      #  blocks or fix malformed syntax.
      #
      #  This step extracts applicationId / versionCode / versionName from
      #  the existing file (or infers them from pubspec.yaml) and writes a
      #  FRESH, known-good build.gradle.kts (or .gradle) template.
      # ============================================================
      - name: Deep fix Flutter Android config (rewrite from scratch)
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project/android/app

          echo "=== Deep fix: rewriting build.gradle(.kts) with known-good template ==="

          # ── 1. Extract applicationId / versionCode / versionName ──────────
          APP_ID=""
          VER_CODE=""
          VER_NAME=""

          # Try from build.gradle.kts first
          if [ -f build.gradle.kts ]; then
            APP_ID=$(grep -oE 'applicationId\s*=\s*"[^"]+"' build.gradle.kts | head -n1 | sed 's/.*"\([^"]*\)".*/\1/' || true)
            VER_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' build.gradle.kts | head -n1 | grep -oE '[0-9]+' || true)
            VER_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' build.gradle.kts | head -n1 | sed 's/.*"\([^"]*\)".*/\1/' || true)
          fi

          # Fallback: try from build.gradle (Groovy)
          if [ -z "$APP_ID" ] && [ -f build.gradle ]; then
            APP_ID=$(grep -oE 'applicationId\s+"[^"]+"' build.gradle | head -n1 | sed 's/.*"\([^"]*\)".*/\1/' || true)
            VER_CODE=$(grep -oE 'versionCode\s+[0-9]+' build.gradle | head -n1 | grep -oE '[0-9]+' || true)
            VER_NAME=$(grep -oE 'versionName\s+"[^"]+"' build.gradle | head -n1 | sed 's/.*"\([^"]*\)".*/\1/' || true)
          fi

          # Fallback: infer from pubspec.yaml
          PUBSPEC="../../pubspec.yaml"
          if [ -f "$PUBSPEC" ]; then
            if [ -z "$VER_CODE" ] || [ -z "$VER_NAME" ]; then
              PUB_VER=$(grep -E '^version:' "$PUBSPEC" | head -n1 | sed 's/^version:[[:space:]]*//' || true)
              # pubspec version format: X.Y.Z+N  → versionName=X.Y.Z, versionCode=N
              if [ -n "$PUB_VER" ]; then
                PUB_VER_NAME=$(echo "$PUB_VER" | sed 's/+.*//' || true)
                PUB_VER_CODE=$(echo "$PUB_VER" | sed 's/.*+//' || true)
                [ -z "$VER_NAME" ] && VER_NAME="$PUB_VER_NAME"
                [ -z "$VER_CODE" ] && VER_CODE="$PUB_VER_CODE"
              fi
            fi
            # Infer applicationId from pubspec name
            if [ -z "$APP_ID" ]; then
              PUB_NAME=$(grep -E '^name:' "$PUBSPEC" | head -n1 | sed 's/^name:[[:space:]]*//' | tr -d '"' || true)
              if [ -n "$PUB_NAME" ]; then
                # Convert snake_case to com.example.snake_case
                APP_ID="com.example.${PUB_NAME}"
              fi
            fi
          fi

          # Final defaults
          [ -z "$APP_ID" ] && APP_ID="com.example.app"
          [ -z "$VER_CODE" ] && VER_CODE="1"
          [ -z "$VER_NAME" ] && VER_NAME="1.0.0"
          echo "Extracted: applicationId=$APP_ID  versionCode=$VER_CODE  versionName=$VER_NAME"

          # ── 2. Detect Flutter Gradle plugin variant ───────────────────────
          # Flutter 3.16+ uses: id("dev.flutter.flutter-gradle-plugin")
          # Older Flutter uses: flutter { source = "../.." }  (bottom of file)
          # Check settings.gradle.kts to see which variant the project uses.
          SETTINGS_FILE="../settings.gradle.kts"
          SETTINGS_GROOVY="../settings.gradle"
          USE_FLUTTER_PLUGIN=false
          if [ -f "$SETTINGS_FILE" ]; then
            if grep -q 'dev.flutter.flutter-gradle-plugin' "$SETTINGS_FILE"; then
              USE_FLUTTER_PLUGIN=true
            fi
          elif [ -f "$SETTINGS_GROOVY" ]; then
            if grep -q 'dev.flutter.flutter-gradle-plugin' "$SETTINGS_GROOVY"; then
              USE_FLUTTER_PLUGIN=true
            fi
          fi

          # ── 3. Write FRESH build.gradle.kts (Kotlin DSL) ──────────────────
          # This is a known-good template that works with AGP 8.x + Flutter.
          cat > build.gradle.kts << GRADLE_KTS
plugins {
    id("com.android.application")
    id("kotlin-android")
$(if [ "$USE_FLUTTER_PLUGIN" = "true" ]; then echo '    id("dev.flutter.flutter-gradle-plugin")'; fi)
}

android {
    namespace = "${APP_ID}"
    compileSdk = 35

    defaultConfig {
        applicationId = "${APP_ID}"
        minSdk = 21
        targetSdk = 34
        versionCode = ${VER_CODE}
        versionName = "${VER_NAME}"
    }

    signingConfigs {
        create("release") {
            storeFile = file("release.keystore")
            storePassword = "password"
            keyAlias = "release"
            keyPassword = "password"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("release")
            isMinifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}
GRADLE_KTS

          # If NOT using the Flutter Gradle plugin, add the flutter source block at the bottom
          if [ "$USE_FLUTTER_PLUGIN" = "false" ]; then
            echo '' >> build.gradle.kts
            echo 'flutter {' >> build.gradle.kts
            echo '    source = "../.."' >> build.gradle.kts
            echo '}' >> build.gradle.kts
          fi

          echo "✅ Wrote fresh build.gradle.kts (known-good template)"
          echo "--- Preview ---"
          cat build.gradle.kts
          echo "--- End preview ---"

          # ── 4. Also ensure proguard-rules.pro exists (referenced by template) ─
          if [ ! -f proguard-rules.pro ]; then
            echo "# Add project specific ProGuard rules here." > proguard-rules.pro
            echo "✅ Created empty proguard-rules.pro"
          fi

          # ── 5. Ensure release.keystore is copied ──────────────────────────
          if [ ! -f release.keystore ]; then
