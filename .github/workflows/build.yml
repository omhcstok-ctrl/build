name: Build APK

on:
  push:
    branches:
      - build
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (flutter / web2apk)'
        required: false
        default: 'flutter'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Repo structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""
          echo "=== build-assets ==="
          ls -la build-assets/ 2>/dev/null || echo "(no build-assets folder)"
          echo ""
          echo "=== build-config.json ==="
          cat build-config.json 2>/dev/null || echo "(no build-config.json)"
          echo ""

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle 8.9
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      - name: Read build config
        id: config
        shell: bash
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)"             >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)"               >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)"     >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            cat build-config.json
          else
            echo "type=unknown" >> $GITHUB_ENV
          fi

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ═══════════════════════════════════════════════════════════════
      #   WEB2APK
      # ═══════════════════════════════════════════════════════════════
      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        shell: bash
        run: |
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.type == 'web2apk'
        shell: bash
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java sources
        if: env.type == 'web2apk'
        shell: bash
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("intent:") || url.startsWith("whatsapp:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          if (progress >= 100) {
                              progressBar.setVisibility(View.GONE);
                          } else {
                              progressBar.setVisibility(View.VISIBLE);
                          }
                      }
                  });
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(request);
                      }
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  super.onBackPressed();
              }
              @Override
              protected void onResume() {
                  if (webView != null) webView.onResume();
              }
              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }
              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              private static final int SPLASH_DELAY = 1800;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      Intent intent = new Intent(SplashActivity.this, MainActivity.class);
                      startActivity(intent);
                      finish();
                  }, SPLASH_DELAY);
              }
          }
          EOF

      - name: Web2APK - Create manifest & layouts
        if: env.type == 'web2apk'
        shell: bash
        run: |
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#000000"
                  app:titleTextColor="#FFFFFF"/>
              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:gravity="center"
                  android:orientation="vertical">
                  <ImageView
                      android:id="@+id/splashLogo"
                      android:layout_width="120dp"
                      android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView
                      android:id="@+id/splashAppName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/app_name"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="20dp" />
                  <ProgressBar
                      android:id="@+id/splashProgress"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply URL, app name, icons, keystore
        if: env.type == 'web2apk'
        shell: bash
        run: |
          sed -i "s|URL_PLACEHOLDER|${{ env.url }}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ env.app_name }}</string>|g" project/app/src/main/res/values/strings.xml

          mkdir -p build-assets

          if [ ! -f build-assets/icon.png ] || ! file build-assets/icon.png | grep -qE "PNG|JPEG|image"; then
            echo "⚠️ Icon tidak valid, membuat default di /tmp..."
            convert -size 512x512 xc:blue /tmp/default_icon.png || exit 0
            cp /tmp/default_icon.png build-assets/icon.png
          fi

          mkdir -p project/app/src/main/res/mipmap-hdpi project/app/src/main/res/mipmap-mdpi \
                   project/app/src/main/res/mipmap-xhdpi project/app/src/main/res/mipmap-xxhdpi \
                   project/app/src/main/res/mipmap-xxxhdpi

          convert build-assets/icon.png -resize 72x72   project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build-assets/icon.png -resize 48x48   project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build-assets/icon.png -resize 96x96   project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 144x144 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 192x192 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp project/app/src/main/res/mipmap-hdpi/ic_launcher.png    project/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-mdpi/ic_launcher.png    project/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xhdpi/ic_launcher.png   project/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png  project/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build
        if: env.type == 'web2apk'
        shell: bash
        run: |
          cd project
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          gradle assembleRelease

      - name: Web2APK - Sign APK
        if: env.type == 'web2apk'
        shell: bash
        run: |
          APK_PATH=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Signing Web2APK: $APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign \
              --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          fi

      # ═══════════════════════════════════════════════════════════════
      #   FLUTTER
      # ═══════════════════════════════════════════════════════════════
      - name: Prepare Flutter project
        if: env.type == 'flutter'
        shell: bash
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "❌ pubspec.yaml tidak ditemukan"
            exit 1
          fi

          echo "✅ Flutter project ready"
          ls -la flutter-project/ | head -20

      # ═══════════════════════════════════════════════════════════════
      #   SMART FLUTTER VERSION DETECTOR
      #   Auto-detect versi Flutter dari SDK constraint + plugin user
      #   Support semua versi publik: 3.10.0 → 3.38.0+
      # ═══════════════════════════════════════════════════════════════
      - name: Smart detect Flutter version
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set +e
          PUBSPEC="flutter-project/pubspec.yaml"

          echo "═══════════════════════════════════════════════════════"
          echo "  🧠 SMART FLUTTER VERSION DETECTOR"
          echo "═══════════════════════════════════════════════════════"

          # ─── STEP 1: Baca SDK constraint dari pubspec user ───
          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          FLUTTER_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'flutter:' | head -n1 | sed 's/.*flutter:[[:space:]]*//; s/["'\'']//g' || true)

          echo "📋 SDK constraint  : $SDK_LINE"
          echo "📋 Flutter constr  : $FLUTTER_LINE"

          # ─── STEP 2: Ekstrak Dart major.minor ───
          DART_MIN="3.0"

          if [ -n "$SDK_LINE" ]; then
            EXTRACTED=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
            if [ -n "$EXTRACTED" ]; then
              DART_MIN="$EXTRACTED"
            fi
          fi
          echo "🎯 Dart minimal terdeteksi: $DART_MIN"

          # ─── STEP 3: Scan plugin yang butuh SDK tinggi ───
          NEEDS_DART=""
          NEEDS_REASON=""

          # Butuh Dart >= 3.9
          for pkg in "font_awesome_flutter:[[:space:]]*(\^|>=)?11\." \
                     "flutter_lints:[[:space:]]*(\^|>=)?6\." \
                     "network_info_plus:[[:space:]]*(\^|>=)?7\." \
                     "device_info_plus:[[:space:]]*(\^|>=)?11\." \
                     "firebase_core:[[:space:]]*(\^|>=)?3\." ; do
            if grep -Eq "$pkg" "$PUBSPEC"; then
              NEEDS_DART="3.9"
              NEEDS_REASON="$pkg"
              echo "⚠️  Plugin butuh Dart >=3.9 → $pkg"
              break
            fi
          done

          # Butuh Dart >= 3.8
          if [ -z "$NEEDS_DART" ]; then
            for pkg in "battery_plus:[[:space:]]*(\^|>=)?6\." \
                       "intl:[[:space:]]*(\^|>=)?0\.20" \
                       "share_plus:[[:space:]]*(\^|>=)?11\." ; do
              if grep -Eq "$pkg" "$PUBSPEC"; then
                NEEDS_DART="3.8"
                NEEDS_REASON="$pkg"
                echo "⚠️  Plugin butuh Dart >=3.8 → $pkg"
                break
              fi
            done
          fi

          # Butuh Dart >= 3.5
          if [ -z "$NEEDS_DART" ]; then
            for pkg in "webview_flutter:[[:space:]]*(\^|>=)?4\.(1[0-9]|[2-9][0-9])" \
                       "geolocator:[[:space:]]*(\^|>=)?14\." \
                       "socket_io_client:[[:space:]]*(\^|>=)?3\." ; do
              if grep -Eq "$pkg" "$PUBSPEC"; then
                NEEDS_DART="3.5"
                NEEDS_REASON="$pkg"
                echo "⚠️  Plugin butuh Dart >=3.5 → $pkg"
                break
              fi
            done
          fi

          # Override kalau plugin butuh lebih tinggi
          if [ -n "$NEEDS_DART" ]; then
            HIGHER=$(printf '%s\n' "$DART_MIN" "$NEEDS_DART" | sort -V | tail -n1)
            if [ "$HIGHER" = "$NEEDS_DART" ]; then
              echo "🔄 Override Dart minimal: $DART_MIN → $NEEDS_DART (dari $NEEDS_REASON)"
              DART_MIN="$NEEDS_DART"
            fi
          fi

          # ─── STEP 4: Map Dart → Flutter ───
          MAJOR=$(echo "$DART_MIN" | cut -d. -f1)
          MINOR=$(echo "$DART_MIN" | cut -d. -f2)

          FLUTTER_VERSION=""

          if [ "$MAJOR" -ge 3 ]; then
            case "$MINOR" in
              0)  FLUTTER_VERSION="3.10.0" ;;
              1)  FLUTTER_VERSION="3.13.0" ;;
              2)  FLUTTER_VERSION="3.16.0" ;;
              3)  FLUTTER_VERSION="3.19.0" ;;
              4)  FLUTTER_VERSION="3.22.0" ;;
              5)  FLUTTER_VERSION="3.24.0" ;;
              6)  FLUTTER_VERSION="3.27.0" ;;
              7)  FLUTTER_VERSION="3.29.0" ;;
              8)  FLUTTER_VERSION="3.32.0" ;;
              9)  FLUTTER_VERSION="3.35.2" ;;
              10) FLUTTER_VERSION="3.38.0" ;;
              *)  FLUTTER_VERSION="3.35.2" ;;
            esac
          else
            FLUTTER_VERSION="3.10.0"
          fi

          # ─── STEP 5: Validasi & fallback ───
          AVAILABLE=("3.10.0" "3.13.0" "3.16.0" "3.19.0" "3.22.0" "3.24.0" "3.27.0" "3.29.0" "3.32.0" "3.35.2")

          IS_AVAILABLE=false
          for v in "${AVAILABLE[@]}"; do
            if [ "$v" = "$FLUTTER_VERSION" ]; then
              IS_AVAILABLE=true
              break
            fi
          done

          if [ "$IS_AVAILABLE" = "false" ]; then
            echo "⚠️  Flutter $FLUTTER_VERSION belum tersedia, fallback 3.35.2"
            FLUTTER_VERSION="3.35.2"
          fi

          echo "═══════════════════════════════════════════════════════"
          echo "  📌 KESIMPULAN:"
          echo "     Dart minimal : >= $DART_MIN"
          echo "     Flutter      : $FLUTTER_VERSION"
          echo "═══════════════════════════════════════════════════════"

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "dart_min=$DART_MIN" >> $GITHUB_OUTPUT
          echo "✅ Using Flutter $FLUTTER_VERSION"

      # ═══════════════════════════════════════════════════════════════
      #   AUTO-DETECT ICONS — skip kalau user sudah punya icon
      # ═══════════════════════════════════════════════════════════════
      - name: Auto-detect & generate Flutter icons
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project

          # PRIORITAS 1: flutter_launcher_icons → SKIP
          if grep -q "flutter_launcher_icons" pubspec.yaml 2>/dev/null; then
            echo "✅ [P1] flutter_launcher_icons terdeteksi → SKIP override"
            exit 0
          fi

          # PRIORITAS 2: Custom icon di mipmap-* → SKIP
          HAS_NATIVE_ICON=false
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            for name in ic_launcher.png ic_launcher_foreground.png icon.png; do
              P="android/app/src/main/res/$dir/$name"
              if [ -f "$P" ]; then
                SIZE=$(stat -c%s "$P" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 100 ]; then
                  echo "✅ [P2] Custom icon: $P → SKIP"
                  HAS_NATIVE_ICON=true
                  break 2
                fi
              fi
            done
          done
          [ "$HAS_NATIVE_ICON" = "true" ] && exit 0

          # PRIORITAS 3: Cari icon.png / logo.png di assets
          ICON_SRC=""
          for candidate in "assets/icon.png" "assets/logo.png" \
                          "assets/images/icon.png" "assets/images/logo.png" \
                          "assets/icons/icon.png" "assets/icons/logo.png" \
                          "assets/icon/icon.png" "assets/icon/logo.png" \
                          "assets/img/icon.png" "icon.png" "logo.png"; do
            if [ -f "$candidate" ] && file "$candidate" | grep -qE "PNG|JPEG|image"; then
              ICON_SRC="$candidate"
              echo "✅ [P3] Icon: $candidate"
              break
            fi
          done

          # PRIORITAS 3b: Auto-cari di assets/
          if [ -z "$ICON_SRC" ] && [ -d "assets" ]; then
            AUTO=$(find assets -type f \( -name "icon.png" -o -name "logo.png" \) 2>/dev/null | head -1)
            [ -z "$AUTO" ] && AUTO=$(find assets -type f \( -iname "*icon*.png" -o -iname "*logo*.png" \) 2>/dev/null | head -1)
            [ -n "$AUTO" ] && ICON_SRC="$AUTO" && echo "✅ [P3b] Auto: $AUTO"
          fi

          # PRIORITAS 4: build-assets dari bot
          if [ -z "$ICON_SRC" ] && [ -f "../build-assets/icon.png" ]; then
            file ../build-assets/icon.png | grep -qE "PNG|JPEG|image" && ICON_SRC="../build-assets/icon.png" && echo "✅ [P4] Bot: build-assets/icon.png"
          fi

          # PRIORITAS 5: Tidak ada → SKIP
          if [ -z "$ICON_SRC" ]; then
            echo "ℹ️  [P5] Tidak ada icon → SKIP (pakai default Flutter)"
            exit 0
          fi

          # Generate icons
          echo "🎨 Generate icon dari: $ICON_SRC"
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
          done

          convert "$ICON_SRC" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          convert "$ICON_SRC" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          convert "$ICON_SRC" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png" 2>/dev/null || true
          done

          echo "✅ Icons generated dari: $ICON_SRC"

      - name: Fix Flutter Android config
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project/android/app
          cp ../../../release.keystore .

          if [ -f build.gradle ]; then
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 36/g' build.gradle
            sed -i 's|storeFile file(".*")|storeFile file("release.keystore")|g' build.gradle
            sed -i 's|storePassword ".*"|storePassword "password"|g' build.gradle
            sed -i 's|keyAlias ".*"|keyAlias "release"|g' build.gradle
            sed -i 's|keyPassword ".*"|keyPassword "password"|g' build.gradle
          elif [ -f build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' build.gradle.kts
            sed -i 's|storeFile = file(".*")|storeFile = file("release.keystore")|g' build.gradle.kts
            sed -i 's|storeFile.set(file(".*"))|storeFile.set(file("release.keystore"))|g' build.gradle.kts
            sed -i 's|storePassword = ".*"|storePassword = "password"|g' build.gradle.kts
            sed -i 's|storePassword.set(".*")|storePassword.set("password")|g' build.gradle.kts
            sed -i 's|keyAlias = ".*"|keyAlias = "release"|g' build.gradle.kts
            sed -i 's|keyAlias.set(".*")|keyAlias.set("release")|g' build.gradle.kts
            sed -i 's|keyPassword = ".*"|keyPassword = "password"|g' build.gradle.kts
            sed -i 's|keyPassword.set(".*")|keyPassword.set("password")|g' build.gradle.kts
          fi

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter APK with smart auto-fix
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project

          echo "=== Flutter Version ==="
          flutter --version
          echo "========================"

          PUB_LOG="../pubget.log"
          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          # ═══════════════════════════════════════════════════════
          #   SMART AUTO-FIX — turunkan plugin konflik
          # ═══════════════════════════════════════════════════════
          auto_fix_pubspec() {
            local FIXED=false
            echo "=== Auto-fixing pubspec.yaml ==="

            declare -A DOWNGRADES=(
              ["shimmer"]="^3.0.0"
              ["font_awesome_flutter"]="^10.8.0"
              ["device_info_plus"]="^10.1.0"
              ["network_info_plus"]="^5.0.3"
              ["battery_plus"]="^5.0.3"
              ["intl"]="^0.19.0"
              ["flutter_lints"]="^5.0.0"
              ["socket_io_client"]="^3.0.0"
              ["firebase_core"]="^2.32.0"
              ["file_picker"]="^6.2.1"
              ["image_picker"]="^1.1.2"
              ["flutter_local_notifications"]="^17.2.4"
              ["workmanager"]="^0.5.2"
              ["share_plus"]="^10.0.0"
              ["audioplayers"]="^6.0.0"
              ["carousel_slider"]="^5.0.0"
              ["webview_flutter"]="^4.7.0"
              ["geolocator"]="^13.0.4"
              ["google_maps_flutter"]="^2.9.0"
              ["permission_handler"]="^11.3.1"
            )

            for pkg in "${!DOWNGRADES[@]}"; do
              TARGET="${DOWNGRADES[$pkg]}"
              if grep -q "$pkg" "$PUB_LOG" 2>/dev/null && \
                 grep -qE "version solving|requires SDK" "$PUB_LOG" 2>/dev/null; then
                echo "  🔧 Fix: $pkg → $TARGET"
                sed -i -E "s|$pkg:[[:space:]]*['\"]?[^'\"]+['\"]?|$pkg: $TARGET|g" pubspec.yaml || true
                FIXED=true
              fi
            done

            if grep -qE "requires SDK version|version solving" "$PUB_LOG" 2>/dev/null; then
              echo "  🔧 Broad SDK constraint"
              sed -i -E "s|sdk:[[:space:]]*['\"]?[^'\"]+['\"]?|sdk: '>=3.5.0 <4.0.0'|g" pubspec.yaml || true
              FIXED=true
            fi

            [ "$FIXED" = true ] && echo "✅ Pubspec di-fix" && rm -f pubspec.lock
          }

          try_pub_get() {
            flutter pub get 2>&1 | tee "$PUB_LOG"
            return ${PIPESTATUS[0]}
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT of $MAX_RETRIES ==="

            if try_pub_get; then
              echo "✅ flutter pub get succeeded"

              if [ "$BUILD_MODE" = "release" ]; then
                if flutter build apk --release; then SUCCESS=true; break; fi
              else
                if flutter build apk --debug; then SUCCESS=true; break; fi
              fi
              rm -rf build .dart_tool
            else
              echo "❌ pub get failed, auto-fix..."
              auto_fix_pubspec
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Build failed after $MAX_RETRIES attempts"
            cat "$PUB_LOG" || true
            exit 1
          fi

      - name: Verify Flutter APK signature
        if: env.type == 'flutter' && env.build_type == 'release'
        shell: bash
        run: |
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Verify signature:"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "APK not found"
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════════
      #   UPLOAD ARTIFACT
      # ═══════════════════════════════════════════════════════════════
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
