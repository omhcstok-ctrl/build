name: Build APK

on:
  push:
    branches: [ main, master, build ]
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type (flutter or web2apk)'
        required: false
        default: 'flutter'
      build_type:
        description: 'Build mode (release or debug)'
        required: false
        default: 'release'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  type: ${{ github.event.inputs.type || 'flutter' }}
  build_type: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies (ImageMagick, jq, unzip, curl)
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            URL_VAL=$(jq -r '.url // ""' build-config.json)
            APP_VAL=$(jq -r '.app_name // "App"' build-config.json)
            if [ -z "${{ env.type }}" ] || [ "${{ env.type }}" = "flutter" ]; then
              TYPE_VAL=$(jq -r '.type // "flutter"' build-config.json)
              echo "type=$TYPE_VAL" >> $GITHUB_ENV
            fi
            echo "url=$URL_VAL" >> $GITHUB_ENV
            echo "app_name=$APP_VAL" >> $GITHUB_ENV
            BT_VAL=$(jq -r '.build_type // ""' build-config.json)
            if [ -n "$BT_VAL" ] && [ -z "${{ github.event.inputs.build_type }}" ]; then
              echo "build_type=$BT_VAL" >> $GITHUB_ENV
            fi
            echo "build-config.json ditemukan:"
            cat build-config.json
          else
            echo "type=${{ env.type }}" >> $GITHUB_ENV
            echo "build_type=${{ env.build_type }}" >> $GITHUB_ENV
            echo "app_name=App" >> $GITHUB_ENV
          fi

      - name: Generate keystore for signing (all builds)
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ============================================================ WEB2APK ==
      # Web2APK: Build universal APK that supports ALL Android ABIs
      # (armeabi-v7a, arm64-v8a, x86, x86_64) — works on every Android device.
      # ============================================================ WEB2APK ==
      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<EOF
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          cat > project/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle (universal APK, all ABIs)
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }
              }
              splits {
                  abi {
                      enable false
                      universalApk true
                  }
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java source files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<EOF
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("intent:") || url.startsWith("whatsapp:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          if (progress >= 100) {
                              progressBar.setVisibility(View.GONE);
                          } else {
                              progressBar.setVisibility(View.VISIBLE);
                          }
                      }
                  });
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, contentDisposition);
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(request);
                      }
                  });
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  super.onBackPressed();
              }
              @Override
              protected void onResume() {
                  if (webView != null) webView.onResume();
              }
              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }
              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<EOF
          package com.web2apk.app;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import androidx.appcompat.app.AppCompatActivity;
          public class SplashActivity extends AppCompatActivity {
              private static final int SPLASH_DELAY = 1800;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      Intent intent = new Intent(SplashActivity.this, MainActivity.class);
                      startActivity(intent);
                      finish();
                  }, SPLASH_DELAY);
              }
          }
          EOF

      - name: Web2APK - Create AndroidManifest.xml and layouts
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          cat > project/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode" />
              </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/layout/activity_main.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">
              <androidx.appcompat.widget.Toolbar
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#000000"
                  app:titleTextColor="#FFFFFF"/>
              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:max="100"/>
              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <WebView
                      android:id="@+id/webView"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          </LinearLayout>
          EOF
          cat > project/app/src/main/res/layout/activity_splash.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:gravity="center"
                  android:orientation="vertical">
                  <ImageView
                      android:id="@+id/splashLogo"
                      android:layout_width="120dp"
                      android:layout_height="120dp"
                      android:src="@mipmap/ic_launcher" />
                  <TextView
                      android:id="@+id/splashAppName"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="@string/app_name"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:textColor="#FFFFFF"
                      android:layout_marginTop="20dp" />
                  <ProgressBar
                      android:id="@+id/splashProgress"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:layout_marginTop="30dp" />
              </LinearLayout>
          </RelativeLayout>
          EOF
          cat > project/app/src/main/res/values/colors.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#2196F3</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          cat > project/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppName</string>
              <string name="loading">Loading...</string>
          </resources>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="SplashTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Web2APK - Apply URL, app name, icons, and keystore
        if: env.type == 'web2apk'
        run: |
          sed -i "s|URL_PLACEHOLDER|${{ env.url }}|g" project/app/src/main/java/com/web2apk/app/MainActivity.java
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ env.app_name }}</string>|g" project/app/src/main/res/values/strings.xml
          if [ ! -f build-assets/icon.png ] || ! file build-assets/icon.png | grep -q PNG; then
            echo "Icon tidak valid, membuat default..."
            convert -size 512x512 xc:blue build-assets/icon.png
          fi
          mkdir -p project/app/src/main/res/mipmap-hdpi project/app/src/main/res/mipmap-mdpi project/app/src/main/res/mipmap-xhdpi project/app/src/main/res/mipmap-xxhdpi project/app/src/main/res/mipmap-xxxhdpi
          convert build-assets/icon.png -resize 72x72 project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert build-assets/icon.png -resize 48x48 project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert build-assets/icon.png -resize 96x96 project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 144x144 project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert build-assets/icon.png -resize 192x192 project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp project/app/src/main/res/mipmap-hdpi/ic_launcher.png project/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-mdpi/ic_launcher.png project/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xhdpi/ic_launcher.png project/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png project/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          rm -f project/app/debug.keystore
          keytool -genkey -v -keystore project/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"

      - name: Web2APK - Build
        if: env.type == 'web2apk'
        run: |
          cd project
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          gradle assembleRelease

      - name: Web2APK - Sign APK
        if: env.type == 'web2apk'
        run: |
          APK_PATH=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          fi

      # ============================================================ FLUTTER ==
      - name: Prepare Flutter project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi

      # ============================================================
      #  FLUTTER - VALIDATE PROJECT STRUCTURE
      #  v3.3.1: Early validation to catch issues before wasting time
      #  on Flutter SDK setup, pub get, etc.
      # ============================================================
      - name: Validate Flutter project structure
        if: env.type == 'flutter'
        run: |
          echo "=== Validating Flutter project structure ==="
          cd flutter-project

          # Check pubspec.yaml
          if [ ! -f pubspec.yaml ]; then
            echo "❌ FATAL: pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          echo "✅ pubspec.yaml found"

          # Check lib/ directory
          if [ ! -d lib ]; then
            echo "❌ FATAL: lib/ directory tidak ditemukan!"
            exit 1
          fi
          echo "✅ lib/ directory found"

          # Check main.dart
          MAIN_DART=""
          for candidate in lib/main.dart lib/main_web.dart lib/main_mobile.dart; do
            if [ -f "$candidate" ]; then
              MAIN_DART="$candidate"
              break
            fi
          done
          if [ -z "$MAIN_DART" ]; then
            echo "⚠️ WARNING: main.dart tidak ditemukan di lib/"
            echo "   Files di lib/:"
            find lib/ -name "*.dart" -maxdepth 2 | head -10
          else
            echo "✅ Entry point found: $MAIN_DART"
          fi

          # Check android/ directory
          if [ ! -d android ]; then
            echo "⚠️ WARNING: android/ directory tidak ditemukan"
            echo "   Bot akan generate Android config dari pubspec.yaml"
          else
            echo "✅ android/ directory found"
            if [ -f android/app/build.gradle.kts ]; then
              echo "✅ android/app/build.gradle.kts found (Kotlin DSL)"
            elif [ -f android/app/build.gradle ]; then
              echo "✅ android/app/build.gradle found (Groovy)"
            else
              echo "⚠️ WARNING: Tidak ada build.gradle atau build.gradle.kts di android/app/"
            fi
            if [ -f android/settings.gradle.kts ]; then
              echo "✅ android/settings.gradle.kts found"
            elif [ -f android/settings.gradle ]; then
              echo "✅ android/settings.gradle found"
            else
              echo "⚠️ WARNING: Tidak ada settings.gradle di android/"
            fi
          fi

          # Check assets referenced in pubspec
          echo ""
          echo "=== Asset files check ==="
          grep -E '^\s+-\s+assets/' pubspec.yaml 2>/dev/null | sed 's/.*- //' | while read -r ASSET; do
            if [ -f "$ASSET" ]; then
              echo "✅ $ASSET"
            else
              echo "⚠️ MISSING: $ASSET"
            fi
          done

          # Check fonts referenced in pubspec
          echo ""
          echo "=== Font files check ==="
          grep -E '^\s+-\s+asset:\s+fonts/' pubspec.yaml 2>/dev/null | sed 's/.*asset: //' | while read -r FONT; do
            if [ -f "$FONT" ]; then
              echo "✅ $FONT"
            else
              echo "⚠️ MISSING: $FONT"
            fi
          done

          echo ""
          echo "=== Validation complete ==="

      - name: Auto-detect icon from user Flutter project
        if: env.type == 'flutter'
        run: |
          echo "Memulai build di Homeserver OmhcSilence — auto-detect icon..."
          cd flutter-project
          mkdir -p android/app/src/main/res

          ICON_SRC=""
          for candidate in \
            assets/icon/icon.png \
            assets/icon/icon.jpg \
            assets/icon/icon/icon.png \
            assets/icon/icon/icon.jpg \
            assets/images/logo.png \
            assets/images/logo.jpg \
            assets/logo.png \
            assets/logo.jpg \
            assets/images/icon.png \
            assets/images/icon.jpg \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp \
            ../build-assets/icon.png \
            ../build-assets/icon.jpg; do
            if [ -f "$candidate" ]; then
              FMT=$(file "$candidate" | grep -oiE 'PNG|JPEG|JPG|WEBP' | head -n1)
              if [ -n "$FMT" ]; then
                SRC_W=$(identify -format '%w' "$candidate" 2>/dev/null || echo 0)
                SRC_H=$(identify -format '%h' "$candidate" 2>/dev/null || echo 0)
                if [ "$SRC_W" -ge 48 ] && [ "$SRC_H" -ge 48 ]; then
                  echo "Icon ditemukan di project user: $candidate (${SRC_W}x${SRC_H}, $FMT)"
                  ICON_SRC="$candidate"
                  break
                fi
              fi
            fi
          done

          mkdir -p /tmp/icon-work
          if [ -n "$ICON_SRC" ]; then
            convert "$ICON_SRC" -strip -define png:exclude-chunk=all /tmp/icon-work/source.png
            if [ $? -ne 0 ] || ! file /tmp/icon-work/source.png | grep -q PNG; then
              echo "Konversi icon gagal — fallback ke Flutter default"
              ICON_SRC=""
            else
              SRC_W=$(identify -format '%w' /tmp/icon-work/source.png 2>/dev/null || echo 0)
              SRC_H=$(identify -format '%h' /tmp/icon-work/source.png 2>/dev/null || echo 0)
              if [ "$SRC_W" -gt 0 ] && [ "$SRC_H" -gt 0 ] && [ "$SRC_W" != "$SRC_H" ]; then
                MAX_DIM=$((SRC_W > SRC_H ? SRC_W : SRC_H))
                convert /tmp/icon-work/source.png -resize ${MAX_DIM}x${MAX_DIM} \
                  -background none -gravity center -extent ${MAX_DIM}x${MAX_DIM} \
                  /tmp/icon-work/source_square.png
                cp /tmp/icon-work/source_square.png /tmp/icon-work/source.png
              fi
            fi
          fi

          if [ -z "$ICON_SRC" ]; then
            echo "Tidak ada icon valid di project user — pakai Flutter default icon"
            convert -size 512x512 xc:"#02569B" \
              -fill white -gravity center -pointsize 320 -annotate +0+0 "App" \
              /tmp/icon-work/source.png 2>/dev/null || \
            convert -size 512x512 xc:"#02569B" /tmp/icon-work/source.png
          fi

          ICON_SRC=/tmp/icon-work/source.png

          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          convert $ICON_SRC -resize 72x72  -strip android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert $ICON_SRC -resize 48x48  -strip android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert $ICON_SRC -resize 96x96  -strip android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert $ICON_SRC -resize 144x144 -strip android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert $ICON_SRC -resize 192x192 -strip android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          done

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          ADAPTIVE_XML='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>'
          printf '%s' "$ADAPTIVE_XML" > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          printf '%s' "$ADAPTIVE_XML" > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          for dir_size in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${dir_size%%:*}"
            size="${dir_size##*:}"
            mkdir -p android/app/src/main/res/$dir
            FG_SIZE=$((size * 67 / 100))
            convert $ICON_SRC -resize ${FG_SIZE}x${FG_SIZE} -strip \
              -background none -gravity center -extent ${size}x${size} \
              android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

          mkdir -p android/app/src/main/res/values
          if [ ! -f android/app/src/main/res/values/ic_launcher_colors.xml ]; then
            COLORS_XML='<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#070D17</color></resources>'
            printf '%s' "$COLORS_XML" > android/app/src/main/res/values/ic_launcher_colors.xml
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'xmlns:tools' "$MANIFEST"; then
              sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">|g' "$MANIFEST"
            fi
            if ! grep -q 'android:roundIcon' "$MANIFEST"; then
              sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher"\n            android:roundIcon="@mipmap/ic_launcher_round"|g' "$MANIFEST"
            fi
          fi

          echo "Icon Flutter siap (legacy + adaptive)"

      # ============================================================
      #  FLUTTER - FIX ANDROID CONFIG (conservative sed-based fixes)
      #  v3.3.1: Removed "Deep fix" rewrite-from-scratch (too aggressive).
      #  Now only patches specific values in existing build.gradle(.kts).
      # ============================================================
      - name: Fix Flutter Android config + signing
        if: env.type == 'flutter'
        run: |
          cd flutter-project/android/app
          cp ../../../release.keystore .

          # Patch existing build.gradle.kts (Kotlin DSL) or build.gradle (Groovy)
          if [ -f build.gradle.kts ]; then
            echo "Patching build.gradle.kts..."
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]*/compileSdk = 35/g' build.gradle.kts
            sed -i 's/targetSdk[[:space:]]*=[[:space:]]*[0-9]*/targetSdk = 34/g' build.gradle.kts
            sed -i 's/minSdk[[:space:]]*=[[:space:]]*[0-9]*/minSdk = 21/g' build.gradle.kts
            sed -i 's|sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9]*|sourceCompatibility = JavaVersion.VERSION_17|g' build.gradle.kts
            sed -i 's|targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion\.VERSION_[0-9]*|targetCompatibility = JavaVersion.VERSION_17|g' build.gradle.kts
            sed -i 's|storeFile[[:space:]]*=[[:space:]]*file(".*")|storeFile = file("release.keystore")|g' build.gradle.kts
            sed -i 's|storeFile\.set(file(".*"))|storeFile.set(file("release.keystore"))|g' build.gradle.kts
            sed -i 's|storePassword[[:space:]]*=[[:space:]]*".*"|storePassword = "password"|g' build.gradle.kts
            sed -i 's|storePassword\.set(".*")|storePassword.set("password")|g' build.gradle.kts
            sed -i 's|keyAlias[[:space:]]*=[[:space:]]*".*"|keyAlias = "release"|g' build.gradle.kts
            sed -i 's|keyAlias\.set(".*")|keyAlias.set("release")|g' build.gradle.kts
            sed -i 's|keyPassword[[:space:]]*=[[:space:]]*".*"|keyPassword = "password"|g' build.gradle.kts
            sed -i 's|keyPassword\.set(".*")|keyPassword.set("password")|g' build.gradle.kts
          elif [ -f build.gradle ]; then
            echo "Patching build.gradle (Groovy)..."
            sed -i 's/compileSdk[[:space:]]*[0-9]*/compileSdk 35/g' build.gradle
            sed -i 's/targetSdk[[:space:]]*[0-9]*/targetSdk 34/g' build.gradle
            sed -i 's/minSdk[[:space:]]*[0-9]*/minSdk 21/g' build.gradle
            sed -i 's|sourceCompatibility[[:space:]]*JavaVersion\.VERSION_[0-9]*|sourceCompatibility JavaVersion.VERSION_17|g' build.gradle
            sed -i 's|targetCompatibility[[:space:]]*JavaVersion\.VERSION_[0-9]*|targetCompatibility JavaVersion.VERSION_17|g' build.gradle
            sed -i 's|storeFile[[:space:]]*file(".*")|storeFile file("release.keystore")|g' build.gradle
            sed -i 's|storePassword[[:space:]]*".*"|storePassword "password"|g' build.gradle
            sed -i 's|keyAlias[[:space:]]*".*"|keyAlias "release"|g' build.gradle
            sed -i 's|keyPassword[[:space:]]*".*"|keyPassword "password"|g' build.gradle
          else
            echo "⚠️ build.gradle / build.gradle.kts tidak ditemukan di android/app/"
            ls -la
          fi

          # gradle.properties — JVM heap + AndroidX
          PROPS="../gradle.properties"
          if [ -f "$PROPS" ]; then
            grep -q 'org.gradle.jvmargs' "$PROPS" || echo 'org.gradle.jvmargs=-Xmx2g' >> "$PROPS"
            grep -q 'android.useAndroidX' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
            grep -q 'android.enableJetifier' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"
          fi

          echo "=== Android config patched ==="

      - name: Diagnostic info
        if: env.type == 'flutter'
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  DIAGNOSTIC INFO — Homeserver OmhcSilence"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "=== Environment ==="
          echo "Build type: ${{ env.build_type }}"
          echo "Runner OS: $(uname -a)"
          echo "Disk space:"
          df -h / | tail -1
          echo ""
          echo "=== Flutter project structure ==="
          cd flutter-project
          echo "pubspec.yaml exists: $([ -f pubspec.yaml ] && echo YES || echo NO)"
          echo "lib/main.dart exists: $([ -f lib/main.dart ] && echo YES || echo NO)"
          echo "android/ exists: $([ -d android ] && echo YES || echo NO)"
          echo "android/app/build.gradle.kts exists: $([ -f android/app/build.gradle.kts ] && echo YES || echo NO)"
          echo "android/app/build.gradle exists: $([ -f android/app/build.gradle ] && echo YES || echo NO)"
          echo "android/settings.gradle.kts exists: $([ -f android/settings.gradle.kts ] && echo YES || echo NO)"
          echo ""
          echo "=== pubspec.yaml (first 30 lines) ==="
          head -30 pubspec.yaml || true
          echo ""
          echo "=== SDK constraint ==="
          grep -A2 '^environment:' pubspec.yaml || true
          echo ""
          echo "=== Key dependencies ==="
          grep -E 'flutter_lints:|shimmer:|flutter_sound:|webview_flutter:|audioplayers:|permission_handler:|flutter_launcher_icons:' pubspec.yaml || true
          echo ""
          echo "=== android/app/build.gradle.kts (if exists) ==="
          cat android/app/build.gradle.kts 2>/dev/null | head -40 || echo "NOT FOUND"
          echo ""
          echo "=== android/app/build.gradle (if exists) ==="
          cat android/app/build.gradle 2>/dev/null | head -40 || echo "NOT FOUND"
          echo ""
          echo "=== Icon files found ==="
          find assets/ android/app/src/main/res/mipmap-*/ -name "*.png" -o -name "*.jpg" -o -name "*.webp" 2>/dev/null | head -20 || echo "No icons found"
          echo ""
          echo "═══════════════════════════════════════════════════"

      - name: Auto-detect Flutter version from pubspec.yaml
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"

          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'"'"']//g' || true)
          echo "Detected raw SDK constraint: $SDK_LINE"

          DART_VERSION=""
          if echo "$SDK_LINE" | grep -qE '>='; then
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '>=[[:space:]]*[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          elif echo "$SDK_LINE" | grep -qE '\^'; then
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '\^[[:space:]]*[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          else
            DART_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          fi
          echo "Extracted Dart version (min): $DART_VERSION"

          UPPER_BOUND=$(echo "$SDK_LINE" | grep -oE '<[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "Extracted upper bound: ${UPPER_BOUND:-none}"

          FLUTTER_VERSION="3.35.2"
          EXCLUDES_DART_35=false
          if [ -n "$UPPER_BOUND" ]; then
            UB_MAJOR=$(echo "$UPPER_BOUND" | cut -d. -f1)
            UB_MINOR=$(echo "$UPPER_BOUND" | cut -d. -f2)
            if [ "$UB_MAJOR" = "3" ] && [ "$UB_MINOR" -lt 5 ] 2>/dev/null; then
              EXCLUDES_DART_35=true
            fi
          fi

          if [ "$EXCLUDES_DART_35" = "true" ]; then
            echo "Upper bound <$UPPER_BOUND excludes Dart 3.5+ → using older Flutter"
            case "$DART_VERSION" in
              "3.4"*) FLUTTER_VERSION="3.22.0" ;;
              "3.3"*) FLUTTER_VERSION="3.19.0" ;;
              "3.2"*) FLUTTER_VERSION="3.16.0" ;;
              "3.1"*) FLUTTER_VERSION="3.13.0" ;;
              "3.0"*) FLUTTER_VERSION="3.10.0" ;;
              *)       FLUTTER_VERSION="3.22.0" ;;
            esac
          else
            echo "No upper-bound exclusion → using latest stable Flutter $FLUTTER_VERSION"
          fi

          # Plugin-based overrides
          if grep -Eq 'flutter_lints:[[:space:]]*(\^|>=)?[5-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq '^[[:space:]]*lints:[[:space:]]*(\^|>=)?[5-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'very_good_analysis:[[:space:]]*(\^|>=)?[7-9]\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?4\.(1[5-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?5\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'geolocator:[[:space:]]*(\^|>=)?(14|15)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?2\.(1[0-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'firebase_[a-z_]+:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'flutter_local_notifications:[[:space:]]*(\^|>=)?(17|18)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'workmanager:[[:space:]]*(\^|>=)?0\.(6|[7-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'file_picker:[[:space:]]*(\^|>=)?(8|9)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?(12|13)\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi
          if grep -Eq 'flutter_sound:[[:space:]]*(\^|>=)?9\.([1-9][0-9])' "$PUBSPEC"; then
            if [ "$FLUTTER_VERSION" \< "3.27.0" ] 2>/dev/null; then FLUTTER_VERSION="3.27.0"; fi
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "Final Flutter version: $FLUTTER_VERSION"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Doctor
        if: env.type == 'flutter'
        run: cd flutter-project && flutter doctor -v

      - name: Pre-build code fixes
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project
          echo "Pre-build code analysis..."

          find lib/ -name "*.dart" -type f 2>/dev/null | while IFS= read -r FILE; do
            if [ ! -f "$FILE" ]; then continue; fi
            CHANGED=0
            if grep -q '\.withValues(alpha:' "$FILE"; then
              sed -i -E 's/\.withValues\(alpha:\s*([^)]+)\)/.withOpacity(\1)/g' "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\bColor\b.*\.value\b' "$FILE"; then
              sed -i -E 's/(\w+Color)\.value\b/(\1.toARGB32())/g' "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\b(StreamSubscription|StreamController|Completer|Timer)\b' "$FILE" && ! grep -q "import 'dart:async'" "$FILE"; then
              sed -i "1i import 'dart:async';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\bUint8List\b' "$FILE" && ! grep -q "import 'dart:typed_data'" "$FILE"; then
              sed -i "1i import 'dart:typed_data';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\b(jsonEncode|jsonDecode|utf8|base64)\b' "$FILE" && ! grep -q "import 'dart:convert'" "$FILE"; then
              sed -i "1i import 'dart:convert';" "$FILE"
              CHANGED=1
            fi
            if grep -Eq '\bhttp\.(get|post|put|delete|patch|Response|Client)\b' "$FILE" && ! grep -q "import 'package:http" "$FILE"; then
              sed -i "1i import 'package:http/http.dart' as http;" "$FILE"
              CHANGED=1
            fi
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application\b|<uses-permission android:name="android.permission.INTERNET" />\n    <application|g' "$MANIFEST"
          fi
          if [ -f "$MANIFEST" ] && ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application\b|<application android:usesCleartextTraffic="true"|g' "$MANIFEST"
          fi
          if [ -f "$MANIFEST" ] && ! grep -q 'android:exported' "$MANIFEST"; then
            sed -i 's|<activity\b|<activity android:exported="true"|g' "$MANIFEST"
          fi

          rm -f pubspec.lock .flutter-plugins .flutter-plugins-dependencies

      - name: Get Dependencies
        if: env.type == 'flutter'
        run: cd flutter-project && flutter pub get

      - name: Clean Build
        if: env.type == 'flutter'
        run: cd flutter-project && flutter clean

      - name: Re-Get Dependencies
        if: env.type == 'flutter'
        run: cd flutter-project && flutter pub get

      - name: Generate Launcher Icons
        if: env.type == 'flutter'
        run: cd flutter-project && dart run flutter_launcher_icons || true

      - name: Build APK Release
        if: env.type == 'flutter' && env.build_type != 'debug'
        run: cd flutter-project && flutter build apk --release

      - name: Build APK Debug
        if: env.type == 'flutter' && env.build_type == 'debug'
        run: cd flutter-project && flutter build apk --debug

      - name: Build App Bundle AAB
        if: env.type == 'flutter' && env.build_type != 'debug'
        run: cd flutter-project && flutter build appbundle --release

      # ============================================================ UPLOAD ==
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB Artifact
        if: env.type == 'flutter' && env.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: flutter-project/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
